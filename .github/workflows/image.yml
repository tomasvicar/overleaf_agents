name: build compile image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - packages.txt
      - compile-paper
      - texlive.profile
      - test/**
      - .github/workflows/image.yml
  pull_request:
    paths:
      - Dockerfile
      - packages.txt
      - compile-paper
      - texlive.profile
      - test/**
      - .github/workflows/image.yml
  schedule:
    # Monthly, so the Debian layer keeps picking up security updates.
    - cron: "0 4 1 * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/latex-overleaf
  # The TeX Live release the image is pinned to. Match it to the version
  # selected in Overleaf (Menu -> Settings -> TeX Live version), then move
  # both forward together.
  DEFAULT_TL_YEAR: "2025"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        tl_year: ["2025"]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # --- build amd64 only, load it, and prove it can compile a paper ------
      - name: Build (amd64, for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: latex-overleaf:test
          build-args: TL_YEAR=${{ matrix.tl_year }}
          cache-from: type=gha,scope=tl${{ matrix.tl_year }}
          cache-to: type=gha,mode=max,scope=tl${{ matrix.tl_year }}

      - name: Smoke test — compile the sample manuscript
        run: |
          docker run --rm -v "$PWD/test:/work" --user "$(id -u):$(id -g)" \
            latex-overleaf:test
          test -f test/smoke.pdf || { echo "no PDF produced"; exit 1; }
          echo "PDF size: $(stat -c%s test/smoke.pdf) bytes"

      - name: Report image size
        run: docker image ls latex-overleaf:test --format '{{.Size}}'

      # --- publish multi-arch (Intel + Apple Silicon) -----------------------
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          tags="${IMAGE}:TL${{ matrix.tl_year }}"
          if [ "${{ matrix.tl_year }}" = "${DEFAULT_TL_YEAR}" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: TL_YEAR=${{ matrix.tl_year }}
          cache-from: type=gha,scope=tl${{ matrix.tl_year }}
          cache-to: type=gha,mode=max,scope=tl${{ matrix.tl_year }}
